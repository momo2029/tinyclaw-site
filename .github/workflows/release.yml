name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.2.0)'
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: tinyclaw-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: tinyclaw-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: tinyclaw-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: tinyclaw-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: momo2029/tinyclaw
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ startsWith(matrix.name, 'tinyclaw-windows') && 'tinyclaw.exe' || 'tinyclaw' }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries
        run: |
          mkdir -p release
          cp artifacts/tinyclaw-linux-x64/tinyclaw release/tinyclaw-linux-x64
          cp artifacts/tinyclaw-macos-arm64/tinyclaw release/tinyclaw-macos-arm64
          cp artifacts/tinyclaw-macos-x64/tinyclaw release/tinyclaw-macos-x64
          cp artifacts/tinyclaw-windows-x64.exe/tinyclaw.exe release/tinyclaw-windows-x64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: release/*
          draft: false
          generate_release_notes: true
